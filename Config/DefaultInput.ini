[/Script/Engine.InputSettings]
; --- CryptoKombat local versus (classic Action/Axis fallback) ---
; Enhanced Input assets (IMC_Fight / IA_*) should be created in Content/Input
; and bound on BP_CryptoFighter. Until then, these bindings drive ACryptoFighter.

; Player 1 — WASD + JKLUIO + Shift
-AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.25,Exponent=1.f,Sensitivity=1.f))
+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.25,Sensitivity=1.f,Exponent=1.f,bInvert=False))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Sensitivity=0.07,Exponent=1.f,bInvert=False))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Sensitivity=0.07,Exponent=1.f,bInvert=False))

bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; Axes
+AxisMappings=(AxisName="P1_Move",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="P1_Move",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="P2_Move",Scale=1.000000,Key=Right)
+AxisMappings=(AxisName="P2_Move",Scale=-1.000000,Key=Left)

; P1 actions
+ActionMappings=(ActionName="P1_Jump",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=W)
+ActionMappings=(ActionName="P1_PunchLight",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=J)
+ActionMappings=(ActionName="P1_PunchHeavy",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=U)
+ActionMappings=(ActionName="P1_KickLight",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=K)
+ActionMappings=(ActionName="P1_KickHeavy",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=I)
+ActionMappings=(ActionName="P1_Special1",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=L)
+ActionMappings=(ActionName="P1_Special2",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=O)
+ActionMappings=(ActionName="P1_Block",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=LeftShift)

; P2 actions
+ActionMappings=(ActionName="P2_Jump",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Up)
+ActionMappings=(ActionName="P2_PunchLight",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=NumPadOne)
+ActionMappings=(ActionName="P2_PunchHeavy",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=NumPadFour)
+ActionMappings=(ActionName="P2_KickLight",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=NumPadTwo)
+ActionMappings=(ActionName="P2_KickHeavy",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=NumPadFive)
+ActionMappings=(ActionName="P2_Special1",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=NumPadThree)
+ActionMappings=(ActionName="P2_Special2",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=NumPadSix)
+ActionMappings=(ActionName="P2_Block",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=RightControl)

; Console
ConsoleKeys=Tilde
